# GitHub Pages へ main ブランチの内容をそのまま公開する（ビルド不要の静的サイト）
# Settings → Pages の Source が「GitHub Actions」でも「Deploy from a branch (main / root)」でも動く。
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: テスト（エンジンが Python 参照実装と一致するか等）
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: for t in tests/*.test.mjs; do node "$t"; done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
