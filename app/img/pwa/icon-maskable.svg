<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 16次元診断のアイコン（仮）。maskable 用（Android が丸・角丸などに切り抜く）
       地は端まで塗る。文字は中央 80% の円（半径 205）の内側に収める。iPhone の apple-touch-icon もこの絵から作る
       PNG は tools/make_pwa_icons.mjs で書き出す。差し替え方：docs/app-screens.md §15 -->
  <rect width="512" height="512" fill="#A15E58"/>
  <text x="250" y="240" text-anchor="middle" dominant-baseline="central"
        font-family="'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif" font-weight="700"
        font-size="240" letter-spacing="-3" fill="#F8F3EE">16</text>
</svg>
