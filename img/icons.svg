<svg xmlns="http://www.w3.org/2000/svg">
  <!-- 線のアイコン（このサイト用に描いたもの）。viewBox 24・線の太さ 1.5・塗りなし・色は使う側の文字色（currentColor）。
       使い方：js/ui/dom.js の icon(name) → <svg aria-hidden="true"><use href="img/icons.svg#name"></use></svg>。名前の一覧は ICON_NAMES と同じ -->
  <symbol id="arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5"/>
    <path d="M11 6l-6 6 6 6"/>
  </symbol>
  <symbol id="arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14"/>
    <path d="M13 6l6 6-6 6"/>
  </symbol>
  <symbol id="arrow-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5"/>
    <path d="M6 11l6-6 6 6"/>
  </symbol>
  <symbol id="chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 9.5l6 6 6-6"/>
  </symbol>
  <symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12.5l4.5 4.5L19 7.5"/>
  </symbol>
  <symbol id="close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 6.5l11 11"/>
    <path d="M17.5 6.5l-11 11"/>
  </symbol>
  <symbol id="info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.75"/>
    <path d="M12 11v5.5"/>
    <path d="M12 7.75v0.01"/>
  </symbol>
  <symbol id="alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.3 4.6a2 2 0 0 1 3.4 0l7.1 12.4a2 2 0 0 1-1.7 3H4.9a2 2 0 0 1-1.7-3z"/>
    <path d="M12 9.5v4.5"/>
    <path d="M12 16.75v0.01"/>
  </symbol>
  <symbol id="copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8.75" y="8.75" width="11" height="11" rx="2"/>
    <path d="M15.25 8.75V6.25a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2.5"/>
  </symbol>
  <symbol id="redo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.75 12a7.25 7.25 0 1 0 2.12-5.13"/>
    <path d="M6.25 3.75v3.5h3.5"/>
  </symbol>
</svg>
